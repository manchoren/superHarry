# Install this as a root-managed drop-in for both superharry.service and
# superharry-chat-worker.service only after the baseline deployment smoke checks.
[Service]
Environment=SUPERHARRY_GEMINI_CHAT=1
Environment=SUPERHARRY_ENABLED_FREE_PROVIDERS=gemini,groq,openrouter
Environment=SUPERHARRY_OPENROUTER_APPROXIMATE_QUOTA=1
Environment=SUPERHARRY_FREE_PROVIDER_ORDER=gemini,groq,openrouter
LoadCredentialEncrypted=openrouter-api-key:/etc/credstore.encrypted/superharry-openrouter-api-key
