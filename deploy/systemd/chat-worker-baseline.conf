# Install only as a root-managed drop-in for superharry-chat-worker.service
# after confirming the durable queue is empty and web chat admission is off.
[Service]
Environment=SUPERHARRY_GEMINI_CHAT=1
Environment=SUPERHARRY_ENABLED_FREE_PROVIDERS=gemini,groq
Environment=SUPERHARRY_OPENROUTER_APPROXIMATE_QUOTA=0
Environment=SUPERHARRY_FREE_PROVIDER_ORDER=gemini,groq
