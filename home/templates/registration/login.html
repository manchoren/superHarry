{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% translate "Sign in" %} · superHarry</title>
</head>
<body>
    <main>
        <h1>{% translate "Sign in" %}</h1>
        {% if form.errors %}
            <p>{% translate "Your username and password didn't match. Please try again." %}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit">{% translate "Sign in" %}</button>
        </form>
    </main>
</body>
</html>
